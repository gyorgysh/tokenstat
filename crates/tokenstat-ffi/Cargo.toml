[package]
name = "tokenstat-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
description = "C ABI bridge exposing the tokenstat core to native front ends"

[lib]
# staticlib for linking into an Apple app bundle, rlib so the crate's own tests
# can call the Rust side directly.
crate-type = ["staticlib", "rlib"]

[dependencies]
tokenstat-core.workspace = true
# The bridge links a network stack, because account and sync belong to the app.
# That is allowed here and forbidden in `tokenstat-core`, which is the crate the
# privacy claim rests on: the code that reads your logs cannot send them
# anywhere. Keep it that way. Nothing network-shaped may move down into core to
# make a call here more convenient.
tokenstat-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
