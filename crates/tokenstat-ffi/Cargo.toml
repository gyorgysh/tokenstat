[package]
name = "tokenstat-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
description = "C ABI bridge exposing the tokenstat core to native front ends"

[lib]
# staticlib for linking into an Apple app bundle, rlib so the crate's own tests
# can call the Rust side directly.
crate-type = ["staticlib", "cdylib", "rlib"]

# Passed straight through to the host. The iOS and simulator slices of the
# xcframework build with `--no-default-features`, which is what takes terminals,
# workspaces and this machine's own archive out of a mobile binary. See
# `scripts/build-ffi-xcframework.sh` and `docs/mobile-app.md`.
[features]
default = ["local-host"]
local-host = ["tokenstat-host/local-host"]

[dependencies]
tokenstat-host = { workspace = true }
# Transitively links a network stack through the host, because account and
# sync belong to the app. That stays forbidden in `tokenstat-core`, which is
# the crate the privacy claim rests on: the code that reads your logs cannot
# send them anywhere. Nothing network-shaped may move down into core to make a
# call here more convenient.
serde_json.workspace = true
tokenstat-identity.workspace = true
tokenstat-paths.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
