<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob: data:; connect-src blob: data:; worker-src 'none'; object-src 'none'">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#100d1c; color:#aaa3bb; font:14px system-ui,sans-serif; }
    body { position:fixed; inset:0; width:100vw; height:100vh; }
    @media (prefers-color-scheme: light) { html,body { background:#fbfbfd; color:#66606f; } }
    canvas { display:block; width:100vw; height:100vh; touch-action:none; }
    #status { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:16px; pointer-events:none; }
    #status[hidden] { display:none; }
    #reset { position:absolute; right:12px; top:12px; min-width:44px; min-height:44px; padding:0 14px; border:1px solid #6d48b0; border-radius:12px; background:#1b1430; color:#b996ff; font:600 14px system-ui,sans-serif; }
    #reset[hidden] { display:none; }
    @media (prefers-color-scheme: light) { #reset { background:#f0ecff; color:#6a3dff; border-color:#ccb8ff; } }
  </style>
</head>
<body>
  <canvas id="model" aria-label="3D model; drag to rotate, pinch to zoom"></canvas>
  <div id="status">Loading model…</div>
  <button id="reset" type="button" hidden>Reset view</button>
  <script src="model-engine.js"></script>
</body>
</html>
