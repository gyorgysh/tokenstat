<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob: data:; connect-src blob: data:; worker-src 'none'; object-src 'none'">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#100d1c; color:#aaa3bb; font:14px system-ui,sans-serif; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    #status { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:16px; pointer-events:none; }
    #status[hidden] { display:none; }
  </style>
</head>
<body>
  <canvas id="model" aria-label="3D model; drag to rotate, pinch to zoom"></canvas>
  <div id="status">Loading model…</div>
  <script src="model-engine.js"></script>
</body>
</html>
