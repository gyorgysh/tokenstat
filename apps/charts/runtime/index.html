<!doctype html>
<!-- SPDX-License-Identifier: LicenseRef-tokenstat-source-available -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=5"
        />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'"
        />
        <link rel="stylesheet" href="chart.css" />
        <title>Chart</title>
    </head>
    <body>
        <main id="root" aria-busy="true">
            <header>
                <div class="heading">
                    <h2 id="title">Chart</h2>
                    <p id="subtitle" hidden></p>
                </div>
                <span id="kind" aria-hidden="true"></span>
            </header>
            <p id="description" hidden></p>
            <div id="error" role="alert" hidden></div>
            <div
                id="plot"
                tabindex="0"
                role="img"
                aria-label="Interactive chart. Use arrow keys to inspect values."
            ></div>
            <div id="selection" role="status" aria-live="polite" hidden></div>
            <div class="toolbar" role="group" aria-label="Chart actions">
                <button
                    id="table-toggle"
                    aria-expanded="false"
                    aria-controls="data-panel"
                >
                    <span aria-hidden="true">▦</span> Data
                </button>
                <button id="reset">
                    <span aria-hidden="true">↺</span> Reset
                </button>
                <button id="expand" aria-pressed="false">
                    <span aria-hidden="true">⛶</span> Expand
                </button>
                <button id="copy" hidden>
                    <span aria-hidden="true">⧉</span> Copy selection
                </button>
                <label class="export"
                    >Export
                    <select id="export" aria-label="Export chart">
                        <option value="">Choose format</option>
                        <option value="png">PNG image</option>
                        <option value="svg">SVG image</option>
                        <option value="csv">CSV data</option>
                        <option value="json">Chart JSON</option>
                    </select></label
                >
            </div>
            <section id="data-panel" hidden aria-label="Chart data">
                <div class="table-scroll">
                    <table>
                        <caption id="caption"></caption>
                        <thead id="columns"></thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
                <nav id="pagination" aria-label="Data pages">
                    <button id="previous">← Previous</button
                    ><span id="page" aria-live="polite"></span
                    ><button id="next">Next →</button>
                </nav>
            </section>
            <footer>
                <span id="source"></span
                ><span id="status" role="status" aria-live="polite"></span>
            </footer>
        </main>
        <script src="engine.js"></script>
        <script src="contract.js"></script>
        <script src="chart.js"></script>
    </body>
</html>
