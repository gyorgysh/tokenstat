name: ModelQA
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  ModelQA:
    type: application
    platform: iOS
    sources:
      - ModelQA.swift
      - ../../Sources/Client/ClientChatModelWebView.swift
      - path: ../../../charts/runtime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokenstat.qa.modelgestures
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        TARGETED_DEVICE_FAMILY: '1,2'
  ModelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ModelUITests.swift
    dependencies:
      - target: ModelQA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokenstat.qa.modelgestures.tests
        GENERATE_INFOPLIST_FILE: 'YES'
