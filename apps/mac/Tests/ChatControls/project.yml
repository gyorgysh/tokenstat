name: ChatControlsQA
options:
  bundleIdPrefix: ai.tokenstat
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  ChatControlsQA:
    type: application
    platform: iOS
    sources:
      - ControlsQA.swift
      - ../../Sources/Client/ClientChatControlsSwipe.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokenstat.controlsqa
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
  ControlsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ControlsUITests.swift]
    dependencies:
      - target: ChatControlsQA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokenstat.controlsqa.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: ChatControlsQA
schemes:
  ChatControlsQA:
    build:
      targets:
        ChatControlsQA: all
        ControlsUITests: [test]
    test:
      targets: [ControlsUITests]
