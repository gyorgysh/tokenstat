name: ImageQA
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  ImageQA:
    type: application
    platform: iOS
    sources:
      - ImageQA.swift
      - ../../Sources/Features/Workspaces/Chat/ChatImageViewport.swift
      - ../../Sources/Features/Workspaces/Chat/ChatImageViewerGeometry.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokenstat.qa.imagegestures
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        TARGETED_DEVICE_FAMILY: '1,2'
  ImageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ImageUITests.swift
    dependencies:
      - target: ImageQA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokenstat.qa.imagegestures.tests
        GENERATE_INFOPLIST_FILE: 'YES'
