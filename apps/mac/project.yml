name: Tokenstat

# The Xcode project is generated, not committed. Committing a .xcodeproj means
# resolving pbxproj merge conflicts by hand forever, and this file is the thing
# a reviewer can actually read. Regenerate with `xcodegen` after changing it.
#
#   scripts/build-ffi-xcframework.sh   # must run first, the app links its output
#   cd apps/mac && xcodegen

options:
  bundleIdPrefix: ai.tokenstat
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    # iOS 17 is the floor. The FFI already builds for 17, and the client
    # only needed 26 for liquid glass chrome. Glass buttons, the floating
    # tab bar and scroll-edge fades wrap in `#available(iOS 26, *)` and
    # fall back to the same Theme capsules the Mac uses. The Tab API is
    # 18+, so 17 uses `.tabItem`. See `docs/ios-client-ui.md`.
    iOS: "17.0"
  groupSortPosition: top

packages:
  # The terminal emulator. MIT licensed, from wezterm's author. It renders an
  # arbitrary byte stream rather than owning a process, which is exactly what a
  # view fed from the host's pty.read needs.
  #
  # Pinned to 1.11.2, the last release before the Metal renderer landed. 1.12+
  # compiles a .metal shader as a package resource, so every build needs the
  # `metal` compiler from the Metal toolchain component, which is not installed
  # on a stock Xcode. Bump when the app ships and the renderer is measured; a
  # fresh checkout must build without downloading extra toolchains.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.11.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.1"
    # The build number, and it counts releases: one higher on every tagged
    # version, never reused, never reset by a marketing version change. It sat
    # at "2" through fourteen releases, which the App Store will not take (a
    # build number must rise for each upload) and which makes two different
    # builds indistinguishable in a crash report. v0.3.0 was the fifteenth
    # release, so v0.3.1 is 16 and v0.3.2 is 17.
    #
    # **Every upload spends one, not every release.** A build number that has
    # reached App Store Connect can never be reused, even by a build that was
    # rejected during processing, so a second TestFlight upload of the same
    # marketing version needs the next number. 17 went up as 0.3.2 and 18 is
    # the same 0.3.2 with the orientation keys, and 19 is 0.3.3. Bump on each
    # upload, and bump alongside MARKETING_VERSION in the same commit on each
    # release.
    #
    # 44 to 47 have been uploaded as 0.6.9 on TestFlight. This cut is 48, still
    # 0.6.9: the vault opened by a password, one screen session per peer, and
    # the reconnect loop. Marketing stays where it is because this is a
    # TestFlight build, not a release, and a version number spent here is a
    # version number the next release cannot use.
    # 49 is the same 0.6.9 with the workspaces host readings, the relay
    # mid-message fix, and the machine record republished for the vault.
    # 50 carries the legend empty states, the plan upgrade path, and the
    # screen/vault fixes accumulated since build 49.
    # 51 is the SSH work: the vault merge by age, the way out of a vault
    # nobody can open, SSH tabs and splits over a real session model, live
    # sessions in the sidebar, connect without a context menu, the phone's
    # key bar and snippets, precision pointer control on the screen viewer,
    # and the review sign-in flag.
    # 52 carries the SSH follow-up review fixes: server-row menu polish,
    # themed prompts, snippet targeting safety, fingerprint persistence
    # recovery, and view-only zoom panning.
    # 53 is the SSH design pass: sheets and form controls on the app's own
    # surface, branded segmented tabs, the library given a phone's
    # proportions, snippets that actually run and a run-on-connect flag that
    # finally does something, progress and a working Cancel on every editor,
    # full screen on the remote viewer, and the keychain entitlement the key
    # generator needs.
    # 54 is the terminal that erases, the desktop stream at a third of the
    # bandwidth, full screen that hides everything it said it would, the
    # inspector that no longer takes the window apart, and the first build
    # that tells the relay what a channel is for so a screen session can be
    # metered and capped.
    # 54 went up and is on TestFlight.
    # 55 is the control-mode and typography cut: screen input delivered as a
    # batch at pointer rate rather than one event per poll, capture at 60 fps
    # while somebody is driving, local echo on SSH so a typed character does
    # not wait for a round trip, the key row reachable without leaving full
    # screen, long press on keys and snippets, the vault row settled while the
    # account is asked, the process's own open-file limit raised, idle peer
    # connections closed on a timer, and the whole app drawn in Manrope and
    # JetBrains Mono.
    #
    # Worth knowing for the next upload: the builds list lags behind a
    # successful upload by minutes. Reading it too soon and finding nothing
    # looks exactly like a failed upload, and a retry then answers DUPLICATE,
    # which looks like confirmation. It is not. Give it a few minutes before
    # concluding anything.
    # 55 went up with v0.6.9 and is on TestFlight. 56 to 59 all went up as
    # 0.7.1 and are all spent: 56 carried the per-device workspace grant, 57 the
    # fixes to how a request arrives, 58 the waiting card and Chat on the phone,
    # 59 the local network permission and connecting when the answer lands.
    # 60 is the next one and has not been used.
    CURRENT_PROJECT_VERSION: "59"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Signed ad hoc so a fresh checkout builds and runs with no team set up.
    # The shipped build is Developer ID signed by the release workflow instead,
    # because the app spawns agent CLIs and reads arbitrary project
    # directories, which the App Store sandbox does not permit.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  Tokenstat:
    type: application
    # One target for every Apple platform rather than a target per platform.
    # iPad and iPhone are meant to be the same app against a remote host, so
    # they share these sources and branch on `#if os(macOS)` where the chrome
    # genuinely differs.
    supportedDestinations: [macOS, iOS]
    scheme:
      # Local StoreKit products so the iOS simulator can buy without ASC review.
      storeKitConfiguration: Tokenstat.storekit
    preBuildScripts:
      # Third-party attribution for the bundled dependencies. The Cargo side
      # is generated from the resolved dependency graph (see xtask notices);
      # SwiftTerm is a Swift package, so its notice is a committed file
      # appended here. The generated file lives in Resources so the app can
      # render it in the Account screen's Open source licenses sheet.
      #
      # The two typefaces are appended for the same reason and are not
      # optional: the SIL Open Font License requires its notice to travel with
      # the font, and the font travels inside this bundle.
      - name: Third-party notices
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          cargo run -q -p xtask -- notices "apps/mac/Resources/THIRD_PARTY_NOTICES.md" tokenstat-host
          cat "apps/mac/Resources/SwiftTerm-LICENSE.txt" >> "apps/mac/Resources/THIRD_PARTY_NOTICES.md"
          {
            printf '\n\n## Manrope\n\nBundled as the interface typeface.\n\n'
            cat "apps/mac/Resources/Fonts/Manrope-OFL.txt"
            printf '\n\n## JetBrains Mono\n\nBundled for terminals, code and identifiers.\n\n'
            cat "apps/mac/Resources/Fonts/JetBrainsMono-OFL.txt"
          } >> "apps/mac/Resources/THIRD_PARTY_NOTICES.md"
      # The price book the app ships with, so a fresh install prices something
      # before its first refresh. iPhone and iPad have no CLI to run
      # `tokenstat pricing --refresh` and no daemon to schedule it, and an
      # unpriced heatmap is counts with no money on them.
      #
      # Refreshed weekly rather than per build: this downloads about a megabyte,
      # and paying that on every incremental build to move a date that the app
      # refreshes at runtime anyway is a poor trade. A failed download writes an
      # empty book and says so, so a checkout still builds on a plane.
      - name: Bundled price book
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          SEED="apps/mac/Resources/PriceBookSeed.json"
          if [ -f "$SEED" ] && [ -n "$(find "$SEED" -mtime -7 2>/dev/null)" ]; then
            echo "price book seed is less than a week old, keeping it"
          else
            cargo run -q -p xtask -- pricing-seed "$SEED"
          fi
    postBuildScripts:
      # The notices file is generated during the build, so Xcode's resource
      # copy phase never saw it in the project. Drop it into the finished
      # bundle here.
      - name: Bundle third-party notices
        basedOnDependencyAnalysis: false
        script: |
          cp "$SRCROOT/Resources/THIRD_PARTY_NOTICES.md" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/THIRD_PARTY_NOTICES.md"
      # Same reason as the notices above: generated during this build, so the
      # resource phase never saw it.
      - name: Bundle price book seed
        basedOnDependencyAnalysis: false
        script: |
          cp "$SRCROOT/Resources/PriceBookSeed.json" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PriceBookSeed.json"
    sources:
      - path: Sources
      # Vendor marks for the harnesses. See TRADEMARK.md: these belong to
      # their owners and are not covered by this project's licence.
      - path: Resources
        buildPhase: resources
      # Icon Composer source. Xcode 26 compiles this into the modern
      # appearance-aware app icon and prefers it over the legacy AppIcon set.
      - path: Design/AppIcon/AppIcon.icon
        buildPhase: resources
    dependencies:
      # Linked, not embedded: it is a static library, so it ends up inside the
      # binary and there is nothing to copy into the bundle.
      - framework: Vendor/TokenstatFFI.xcframework
        embed: false
      # The terminal view. Resolved through Swift Package Manager; the package
      # declaration is under `packages:` at the top of this file.
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokenstat.tokenstat
        PRODUCT_NAME: Tokenstat
        # Synthesized from the INFOPLIST_KEY_* settings below, so there is no
        # Info.plist to keep in sync by hand.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: tokenstat
        INFOPLIST_KEY_NSHumanReadableCopyright: "© pueev OÜ. All rights reserved."
        # No sandbox. See CODE_SIGN_IDENTITY above for why.
        ENABLE_APP_SANDBOX: NO
        # On, because notarization requires it. It is not the sandbox: the app
        # still spawns agent CLIs and reads the folders the user registered.
        # What it costs us is nothing we do, and what it buys is a build Apple
        # will notarize.
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Required, not cosmetic: an upload with no orientations declared is
        # rejected outright (error 90474), because an iPad app that does not
        # say what it supports cannot be placed in a multitasking split. All
        # four on both, which is what the rejection asks for. Lock the phone to
        # portrait here if the design ever wants that, rather than dropping the
        # key again.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Cleartext HTTP to 127.0.0.1 for the remote port proxy browser. Without
        # this WKWebView paints a white page for every Browse port URL.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        # Reaching another of your machines across the room, rather than around
        # the world through the relay.
        #
        # Without this key iOS does not ask, it simply refuses: every dial to a
        # LAN address fails and every session falls back to the relay, which is
        # slower, metered, and pueev's to pay for. There is no error to see,
        # which is why this was invisible until somebody watched a desktop on
        # their own Wi-Fi and got relay quality.
        #
        # The sentence is what the system prompt shows, so it says what the
        # permission buys rather than naming an API.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "tokenstat connects straight to your other computers when they are on the same network, which is faster than going through the internet."

        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The accent lives in the catalogue as well as in Theme.swift,
        # because AppKit reads the catalogue for the parts SwiftUI does
        # not own: focus rings, sidebar selection, text selection. A
        # `.tint` at the root cannot reach those.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # Push notifications, iOS and iPadOS only.
      #
      # Scoped by SDK on purpose. The Mac notifies itself locally, which needs
      # no entitlement, and putting `aps-environment` on the macOS build would
      # make the Developer ID release need a provisioning profile it does not
      # have today.
      #
      # Two files because the value is the environment: a development build's
      # device token belongs to Apple's sandbox host and a TestFlight build's
      # to production, and a token sent to the wrong one is refused with
      # BadDeviceToken. The simulator keeps the development file: it cannot
      # receive a real push either way, and it must still build.
      #
      # This needs Push Notifications enabled on the App ID in the developer
      # account, and a provisioning profile regenerated after that. Without it
      # a device build fails to sign rather than failing quietly at runtime.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Entitlements/iOS-Debug.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Entitlements/iOS-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Entitlements/iOS-Release.entitlements
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Entitlements/iOS-Debug.entitlements
