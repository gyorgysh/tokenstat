<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/JetBrainsMono-Variable.ttf");
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0A0A0B; }
  #term { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="xterm-fit.js"></script>
<script>
  // The terminal palette is TerminalPalette (Design/TerminalPalette.swift):
  // dark 0x0A0A0B / 0xDCDCE0, light 0xF7F7F8 / 0x1C1C1F, caret is the brand
  // accent, selection is accentSoft. The face is JetBrains Mono, the same
  // variable face the native UI reads character by character.
  var DARK = {
    background: "#0A0A0B",
    foreground: "#DCDCE0",
    cursor: "#8B5CF6",
    cursorAccent: "#0A0A0B",
    selectionBackground: "#1B1430"
  };
  var LIGHT = {
    background: "#F7F7F8",
    foreground: "#1C1C1F",
    cursor: "#6A3DFF",
    cursorAccent: "#F7F7F8",
    selectionBackground: "#F0ECFF"
  };
  // The page paints for the system appearance from the first frame, so a
  // light phone never flashes the dark theme while Kotlin's push crosses
  // the bridge. The push below only handles later appearance changes.
  var pageDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)").matches : true;
  document.body.style.background = pageDark ? DARK.background : LIGHT.background;
  var term = new Terminal({
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 12,
    theme: pageDark ? DARK : LIGHT,
    // Same 4,000 line scrollback as the Apple client's SwiftTerm view.
    scrollback: 4000
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));

  // Paint for the system appearance, the way the Apple client repaints its
  // terminal view. Kotlin calls this once the page loads and again when the
  // appearance changes.
  function termSetTheme(dark) {
    // The DOM first: even if the emulator object is gone, the page behind
    // it is the right colour instead of the CSS fallback.
    document.body.style.background = dark ? DARK.background : LIGHT.background;
    document.documentElement.style.background = dark ? DARK.background : LIGHT.background;
    if (typeof term === "undefined" || !term) return;
    term.options.theme = dark ? DARK : LIGHT;
    // The options assignment does not always repaint a live canvas in this
    // xterm build, so nudge the rows it owns.
    try { term.refresh(0, term.rows - 1); } catch (e) {}
  }

  // The keyboard has to land somewhere.
  //
  // xterm types into a hidden textarea inside the page, and the Android soft
  // keyboard only appears for a focused editable. Without this the WebView
  // took focus, the IME opened against an input type of zero, and every
  // keystroke went nowhere: a shell that showed its first prompt and then
  // never moved again.
  function termFocus() {
    try {
      term.focus();
      if (term.textarea) term.textarea.focus();
    } catch (e) {}
  }

  function termBlur() {
    try {
      if (term.textarea) term.textarea.blur();
      term.blur();
    } catch (e) {}
  }

  // Tapping the picture is how a terminal is focused everywhere else, so a
  // tap here focuses the textarea and asks Kotlin to raise the keyboard.
  // A tap that selects text does neither: raising the keyboard over a
  // selection is how copying from the transcript is interrupted.
  document.getElementById("term").addEventListener("click", function () {
    var selected = "";
    try {
      selected = window.getSelection ? window.getSelection().toString() : "";
    } catch (e) {}
    if (selected) return;
    termFocus();
    if (window.TermBridge && TermBridge.onWantsKeyboard) TermBridge.onWantsKeyboard();
  });

  var lastRows = -1;
  var lastCols = -1;
  function pushSize() {
    if (window.TermBridge && (term.rows !== lastRows || term.cols !== lastCols)) {
      lastRows = term.rows;
      lastCols = term.cols;
      TermBridge.onResize(term.rows, term.cols);
    }
  }

  term.onData(function (data) {
    if (window.TermBridge) {
      TermBridge.onInput(btoa(unescape(encodeURIComponent(data))));
    }
  });

  // A selection in the emulator leaves the emulator for the system clipboard,
  // the same direction the Apple client's clipboardCopy delegate carries it.
  term.onSelectionChange(function () {
    if (window.TermBridge) {
      var text = term.getSelection();
      if (text) TermBridge.onCopy(text);
    }
  });

  // Scrolls mode: a drag or wheel scrolls the buffer instead of reaching the
  // program, for an agent that holds mouse reporting on. Matches the Apple
  // key bar's scroll toggle, which flips allowMouseReporting on its view.
  var scrollsHandler = null;
  function termSetScrolls(on) {
    if (on && !scrollsHandler) {
      scrollsHandler = function (event) {
        var el = term.element;
        if (!el) return true;
        var delta = event.deltaY || event.detail || 0;
        term.scrollLines(delta > 0 ? 3 : -3);
        event.preventDefault();
        return false;
      };
      term.attachCustomWheelEventHandler(scrollsHandler);
    } else if (!on && scrollsHandler) {
      term.attachCustomWheelEventHandler(function () { return true; });
      scrollsHandler = null;
    }
  }

  // The size Kotlin measured for the view, in CSS pixels.
  //
  // The view and the viewport disagree while the keyboard is open: the
  // window pans instead of resizing, so the layout viewport stays tall
  // while Compose shrinks the view. Fitting against that tall viewport
  // rendered a terminal the window could only pan around, and the WebView
  // pans a scrollable page to follow the focused textarea at the cursor:
  // the picture jumped on every cursor move. Sizing the terminal box to
  // the measured view keeps page and window the same size, so there is
  // nothing to pan. A degenerate size keeps the last good box.
  var sizedW = 0;
  var sizedH = 0;
  function termViewport(w, h) {
    if (!w || !h || w < 1 || h < 1) return termFit();
    var el = document.getElementById("term");
    if (w !== sizedW || h !== sizedH) {
      sizedW = w;
      sizedH = h;
      el.style.width = w + "px";
      el.style.height = h + "px";
    }
    return termFit();
  }

  // Fit to the space there actually is, and refuse a size that says there is
  // none.
  //
  // A WebView inside Compose is loaded before it is measured, so the page's
  // first layout can report a height of zero. The fit addon floors that to
  // one row, and one row is a terminal that shows the last line of everything
  // and the whole of nothing: the shell's prompt, then every command's output
  // scrolling past it. Nothing re-fitted afterwards, so it stayed one row for
  // the life of the session. A degenerate measurement is now declined and the
  // observers below re-fit when the real size arrives.
  function termFit() {
    var proposed = null;
    try {
      proposed = fit.proposeDimensions();
    } catch (e) {
      return false;
    }
    if (!proposed || !proposed.rows || proposed.rows < 2 || !proposed.cols) return false;
    if (proposed.rows !== term.rows || proposed.cols !== term.cols) {
      try {
        term.resize(proposed.cols, proposed.rows);
      } catch (e) {
        return false;
      }
    }
    pushSize();
    return true;
  }

  // `resize` on the window is not enough. The WebView keeps its own viewport
  // size and does not always report the layout that gives the page its
  // height, so the element itself is what gets watched.
  if (window.ResizeObserver) {
    new ResizeObserver(function () { termFit(); }).observe(document.getElementById("term"));
  }
  window.addEventListener("resize", function () { termFit(); });

  // The face decides the cell size, so a fit measured against the fallback
  // font is measured against the wrong one.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { termFit(); });
  }

  // Kotlin hands us base64 so no escaping can corrupt the byte stream.
  function termWriteB64(base64) {
    var bin = atob(base64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
    pushSize();
  }

  // The belt to the observers' braces: a device that reports no size for a
  // moment gets a few more chances before the terminal is left as it is.
  termFit();
  [50, 200, 600, 1500].forEach(function (delay) { setTimeout(termFit, delay); });
</script>
</body>
</html>
