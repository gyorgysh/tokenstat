name: preview

# Unsigned -dev artifacts for testers. Never a GitHub Release, never the
# `release` environment, never signing secrets.
#
# Trigger:
#   Actions → Preview → Run workflow, or add the `preview` label to a PR.
# Rebuilding a labeled PR after new commits: re-run the workflow or toggle
# the label. `synchronize` is not a trigger, so ordinary PR pushes do not
# pay for app packaging.
#
# Do not add these triggers to release.yml. That workflow is tag-only on
# purpose.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which artifacts to build
        type: choice
        options: [all, windows, mac, android, cli]
        default: all
  pull_request:
    types: [labeled]

concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute -dev version
        id: meta
        run: |
          set -euo pipefail
          base="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          sha="$(git rev-parse --short=7 HEAD)"
          version="${base}-dev.${{ github.run_number }}.${sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "preview version ${version}"

  windows:
    name: windows
    needs: version
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.platforms == 'all' ||
         github.event.inputs.platforms == 'windows')) ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-windows
          save-if: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build unsigned Windows app
        id: package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = (Select-String -Path Cargo.toml -Pattern '^version\s*=' |
            Select-Object -First 1).Line.Split('"')[1]
          scripts/build-windows-app.ps1 -Version $base `
            -InformationalVersion $env:VERSION -Rid win-x64 -Out dist
          $name = "tokenstat-$($env:VERSION)-windows-x64"
          $preview = @(
            $env:VERSION
            "unsigned development build. not a release."
          ) -join "`n"
          Set-Content -Path "dist/$name/PREVIEW.txt" -Value $preview
          Push-Location dist
          7z a "$name.zip" $name | Out-Null
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value "$hash  $name.zip"
          Pop-Location
          "asset=$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v7
        with:
          name: preview-windows-${{ github.run_number }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          retention-days: 14

  mac:
    name: mac app
    needs: version
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.platforms == 'all' ||
         github.event.inputs.platforms == 'mac')) ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-mac
          save-if: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build unsigned Tokenstat.app
        run: |
          set -euo pipefail
          # MARKETING_VERSION must stay a dotted number. The -dev identity is
          # on the zip name and PREVIEW.txt, not in About.
          base="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          scripts/build-mac-app.sh "$base" dist

      - name: Archive the bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          name="tokenstat-${VERSION}-macos-unsigned"
          mkdir -p dist/Tokenstat.app/Contents/Resources
          printf '%s\nunsigned development build. not a release.\n' "$VERSION" \
            > dist/Tokenstat.app/Contents/Resources/PREVIEW.txt
          ditto -c -k --keepParent dist/Tokenstat.app "dist/${name}.zip"
          shasum -a 256 "dist/${name}.zip" > "dist/${name}.zip.sha256"
          echo "asset=${name}.zip" >> "$GITHUB_OUTPUT"
        id: package

      - uses: actions/upload-artifact@v7
        with:
          name: preview-mac-${{ github.run_number }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          retention-days: 14

  android:
    name: android apk
    needs: version
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.platforms == 'all' ||
         github.event.inputs.platforms == 'android')) ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-android
          save-if: false

      - name: Install the Rust Android driver
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Debug APK
        run: gradle -p apps/android assembleDebug

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          name="tokenstat-${VERSION}-android-debug.apk"
          cp "$src" "dist/${name}"
          sha256sum "dist/${name}" > "dist/${name}.sha256"
          echo "asset=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: preview-android-${{ github.run_number }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          retention-days: 14

  cli:
    name: cli ${{ matrix.target }}
    needs: version
    if: >
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.platforms == 'all' ||
         github.event.inputs.platforms == 'cli')) ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: preview-cli-${{ matrix.target }}
          save-if: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tokenstat-cli

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="tokenstat-${VERSION}-${TARGET}-dev"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${TARGET}/release/tokenstat.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/tokenstat" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/" 2>/dev/null || cp README.md "dist/${name}/"
          cargo run --release --locked -p xtask -- notices \
            "dist/${name}/THIRD-PARTY-NOTICES.md" tokenstat-cli
          printf '%s\n' "$VERSION" > "dist/${name}/PREVIEW.txt"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
            asset="${name}.zip"
          else
            tar czf "${name}.tar.gz" "${name}"
            asset="${name}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: preview-cli-${{ matrix.target }}-${{ github.run_number }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          retention-days: 14
