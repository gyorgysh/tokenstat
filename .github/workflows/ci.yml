name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  commit-style:
    name: commit style
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check conventional commit format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/check-commit-style.sh

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The shape the mobile slices are built in. `--all-features` above never
      # compiles it, so without this the client build breaks silently and stays
      # broken until somebody runs an iOS build by hand. See
      # `docs/mobile-app.md`.
      - name: Clippy without the local half
        run: |
          cargo clippy -p tokenstat-host --no-default-features --all-targets -- -D warnings
          cargo clippy -p tokenstat-ffi --no-default-features --all-targets -- -D warnings

  # Separate job rather than a step in `lint`, so a formatting failure never
  # hides a breach of the privacy guarantee, and so the red check names the
  # thing that actually broke.
  no-network:
    name: privacy boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Core and MCP must not reach the network
        run: bash scripts/check-no-network.sh

  # Everything here is shipped only by pueev OU, which works because pueev owns
  # all of it. A third party copyleft dependency would quietly end that.
  dep-licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: No dependency may block shipping tokenstat
        run: bash scripts/check-dep-licences.sh

  # .gitignore is not enough on its own: a commit built at an older revision
  # uses that revision's rules, which is how a 30 MB static library once got in.
  no-artifacts:
    name: no build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No generated file may be tracked
        run: bash scripts/check-no-artifacts.sh

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  # The client build, on the platform it ships to.
  #
  # Unsigned and simulator only: this exists to catch shared code that stopped
  # compiling for iOS, which is the failure that actually happens, not to
  # produce an artifact. Signing lives in the release workflow.
  apple-client:
    name: ios client build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Install xcodegen
        run: brew install xcodegen

      # Simulator slice only. The app links whatever the xcframework holds, and
      # building the macOS slices as well would double this job to prove
      # something the test matrix already proves.
      - name: Build the FFI for the simulator
        run: scripts/build-ffi-xcframework.sh sim

      - name: Generate the Xcode project
        run: xcodegen
        working-directory: apps/mac

      - name: Build for the simulator
        run: |
          xcodebuild -scheme Tokenstat \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: apps/mac

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # rustsec/audit-check posts a check run; default workflow perms are read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
