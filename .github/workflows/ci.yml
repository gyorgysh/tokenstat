name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  # On a push as well as a pull request. This repository takes no pull
  # requests, so gating this on one meant the commit format CONTRIBUTING.md
  # documents was never actually checked: five commits on main do not match
  # it. A push checks only the commits it is adding, so history stays as it
  # is and the rule applies from here on.
  commit-style:
    name: commit style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check conventional commit format
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.sha
                || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/check-commit-style.sh

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The shape the mobile slices are built in. `--all-features` above never
      # compiles it, so without this the client build breaks silently and stays
      # broken until somebody runs an iOS build by hand. See
      # `docs/mobile-app.md`.
      - name: Clippy without the local half
        run: |
          cargo clippy -p tokenstat-host --no-default-features --all-targets -- -D warnings
          cargo clippy -p tokenstat-ffi --no-default-features --all-targets -- -D warnings

  # Separate job rather than a step in `lint`, so a formatting failure never
  # hides a breach of the privacy guarantee, and so the red check names the
  # thing that actually broke.
  no-network:
    name: privacy boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Core and MCP must not reach the network
        run: bash scripts/check-no-network.sh

  # Everything here is shipped only by pueev OU, which works because pueev owns
  # all of it. A third party copyleft dependency would quietly end that.
  dep-licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: No dependency may block shipping tokenstat
        run: bash scripts/check-dep-licences.sh

  # .gitignore is not enough on its own: a commit built at an older revision
  # uses that revision's rules, which is how a 30 MB static library once got in.
  no-artifacts:
    name: no build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No generated file may be tracked
        run: bash scripts/check-no-artifacts.sh

  # Same job shape as the other source-text gates: a formatting failure must
  # not hide a bare button, and the red check should name the rule.
  action-icons:
    name: action icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every content button carries a vocabulary glyph
        run: bash scripts/check-action-icons.sh

  # Its own job for the same reason: a bare button and a system-blue control
  # are two different rules, and one red check should name one of them.
  accent-colour:
    name: accent colour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every control takes its colour from the theme
        run: bash scripts/check-accent-colour.sh

  chrome-bars:
    name: chrome bars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Adjacent headers share one optical baseline
        run: bash scripts/check-chrome-bars.sh

  sheet-surfaces:
    name: sheet surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mac task sheets share one modal surface
        run: bash scripts/check-mac-sheet-surfaces.sh

  # And again: a control in the wrong typeface is a third rule, and three
  # rules sharing one red check is one check that says nothing.
  fonts:
    name: fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every font comes from the type scale
        run: bash scripts/check-fonts.sh

  # Its own job again: this one is a protocol mismatch between two languages,
  # not a style rule, and it fails silently at runtime rather than loudly at
  # build time. A red check with its own name is the only warning there is.
  bridge-keys:
    name: bridge keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every bridge model spells its ids the way the host does
        run: bash scripts/check-bridge-keys.sh

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  # The Rust half of the client, on the platform it ships to.
  #
  # This is a regression gate, not a milestone gate. Everything below the Swift
  # layer is shared code that already compiles for iOS, so it can break, and it
  # did: the first run of this job found `open_browser` reaching for a process
  # on a platform that has none.
  #
  # The **app** is deliberately not built here yet. `RootView` is the desktop
  # shell, and the phone is meant to have its own root rather than a
  # phone-sized copy of the Mac window (see `docs/mobile-app.md`). Until that
  # root exists, an app build would fail for a reason that is not a
  # regression, and a job that is always red is a job everybody learns to
  # ignore. Add the `xcodebuild` step back in the same change that adds the
  # client root.
  apple-client:
    name: ios client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Both simulator architectures. `generic/platform=iOS Simulator` builds
      # every architecture the SDK has, so a library holding arm64 alone fails
      # the link on x86_64 even on an Apple Silicon runner. Installing the
      # second target is cheaper than teaching the build to skip it, and it is
      # the slice anyone on an Intel Mac needs anyway.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      # Simulator slices only. The app links whatever the xcframework holds, and
      # building the macOS slices as well would double this job to prove
      # something the test matrix already proves.
      - name: Build the FFI for the simulator
        run: scripts/build-ffi-xcframework.sh sim

      # Back in, now that `ClientRootView` exists. This is the step that catches
      # the real failure mode, which is `#if os(macOS)` rot in shared views, not
      # signing. Unsigned on purpose: no secret is needed to prove it compiles.
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/mac && xcodegen

      - name: Build the app for the simulator
        run: |
          xcodebuild -project apps/mac/Tokenstat.xcodeproj \
            -scheme Tokenstat \
            -destination 'generic/platform=iOS Simulator' \
            build

  android-client:
    name: android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install the Rust Android driver
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Unit tests and release bundle
        run: gradle -p apps/android testDebugUnitTest lintDebug bundleRelease

      - name: Keep native debug symbols with the bundle
        uses: actions/upload-artifact@v6
        with:
          name: tokenstat-android
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/native-debug-symbols/release/**

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # rustsec/audit-check posts a check run; default workflow perms are read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
