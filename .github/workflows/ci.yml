name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  commit-style:
    name: commit style
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check conventional commit format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/check-commit-style.sh

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Separate job rather than a step in `lint`, so a formatting failure never
  # hides a breach of the privacy guarantee, and so the red check names the
  # thing that actually broke.
  no-network:
    name: privacy boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Core and MCP must not reach the network
        run: bash scripts/check-no-network.sh

  # Everything here is shipped only by pueev OU, which works because pueev owns
  # all of it. A third party copyleft dependency would quietly end that.
  dep-licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: No dependency may block shipping tokenstat
        run: bash scripts/check-dep-licences.sh

  # .gitignore is not enough on its own: a commit built at an older revision
  # uses that revision's rules, which is how a 30 MB static library once got in.
  no-artifacts:
    name: no build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No generated file may be tracked
        run: bash scripts/check-no-artifacts.sh

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --workspace --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # rustsec/audit-check posts a check run; default workflow perms are read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
