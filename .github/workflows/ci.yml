name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all components and release Android packaging
        type: boolean
        default: true
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  checks:
    name: source checks and changed components
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || steps.paths.outputs.ci == 'true' }}
      rust: ${{ steps.paths.outputs.rust }}
      apple: ${{ steps.paths.outputs.apple }}
      windows: ${{ steps.paths.outputs.windows }}
      android: ${{ steps.paths.outputs.android }}
      charts: ${{ steps.paths.outputs.charts }}
      dependencies: ${{ steps.paths.outputs.dependencies }}
      test-os: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || steps.paths.outputs.ci == 'true' || steps.paths.outputs.rust == 'true') && '["ubuntu-24.04","macos-latest","windows-latest"]' || steps.paths.outputs.charts == 'true' && '["ubuntu-24.04","windows-latest"]' || '["windows-latest"]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          filters: .github/ci-paths.yml
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Mobile terminal scroll regressions
        if: ${{ !cancelled() }}
        run: |
          node scripts/tests/TerminalScrollTests.cjs
          node scripts/tests/OpenCodeGateTests.mjs

      - name: No generated file may be tracked
        if: ${{ !cancelled() }}
        run: bash scripts/check-no-artifacts.sh
      - name: Check resource keys and translation placeholders
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_localization*.py'
          python3 scripts/check-localization.py
      - name: Every content button carries a vocabulary glyph
        if: ${{ !cancelled() }}
        run: bash scripts/check-action-icons.sh
      - name: Every control takes its colour from the theme
        if: ${{ !cancelled() }}
        run: bash scripts/check-accent-colour.sh
      - name: Adjacent headers share one optical baseline
        if: ${{ !cancelled() }}
        run: bash scripts/check-chrome-bars.sh
      - name: Mac task sheets share one modal surface
        if: ${{ !cancelled() }}
        run: bash scripts/check-mac-sheet-surfaces.sh
      - name: Every font comes from the type scale
        if: ${{ !cancelled() }}
        run: bash scripts/check-fonts.sh
      - name: Every bridge model spells its ids the way the host does
        if: ${{ !cancelled() }}
        run: bash scripts/check-bridge-keys.sh
      - name: The sample reaches nothing outside itself
        if: ${{ !cancelled() }}
        run: bash scripts/check-sample-offline.sh

      - name: Home recent places never contact a machine
        if: ${{ !cancelled() }}
        run: bash scripts/check-home-account-plane.sh
      - name: The Windows zip runs with nothing installed
        if: ${{ !cancelled() }}
        run: bash scripts/check-windows-packaging.sh
      - name: The host pipe times out without ReadTimeout
        if: ${{ !cancelled() }}
        run: bash scripts/check-windows-pipe.sh
      - name: Custom installer paths remain literal
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/test_install_scripts.py
      - name: Mac disk image failures preserve previous artifacts
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/test_mac_dmg.py
      - name: Mac app assembly reuses helpers and preserves failed builds
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/test_mac_build.py
      - name: Failed replacements preserve the installed pair
        if: ${{ !cancelled() }}
        run: bash scripts/tests/install-release-pair.sh
      - name: Failed service stops preserve host binaries
        if: ${{ !cancelled() }}
        run: bash scripts/tests/uninstall-host.sh

  lint:
    needs: checks
    if: needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true'
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The shape the mobile slices are built in. `--all-features` above never
      # compiles it, so without this the client build breaks silently and stays
      # broken until somebody runs an iOS build by hand. See
      # `docs/mobile-app.md`.
      - name: Clippy without the local half
        run: |
          cargo clippy -p tokenstat-host --no-default-features --all-targets -- -D warnings
          cargo clippy -p tokenstat-ffi --no-default-features --all-targets -- -D warnings

      - name: Core and MCP must not reach the network
        if: ${{ !cancelled() }}
        run: bash scripts/check-no-network.sh

      - name: Dependency licences
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/tests/test_licence_rules.py
          bash scripts/check-dep-licences.sh

  # The client's state, without a simulator. Standalone executables compile
  # real sources with their own stubs and catch bugs an Xcode build cannot:
  # a draft resuming into the wrong account or a failure opening the wrong
  # screen. macOS because they need swiftc.
  swift-tests:
    needs: checks
    if: needs.checks.outputs.full == 'true' || needs.checks.outputs.apple == 'true'
    name: swift state tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the standalone client tests
        run: bash scripts/run-swift-tests.sh

      - name: Native macOS simulator models and video framing
        run: python3 scripts/check-simulator.py

      - name: Chat navigation and transcript continuity
        run: |
          python3 scripts/check-chat-navigation.py
          python3 scripts/check-chat-workbench.py
          python3 scripts/check-transcript-layout.py
          python3 scripts/check-ssh-terminal-lifecycle.py
          python3 scripts/check-chat-projection.py
          python3 scripts/check-workspace-refresh.py
          python3 scripts/check-workspace-loading.py
          python3 scripts/check-tunnel-recovery.py
          python3 scripts/check-chat-polling.py
          python3 scripts/check-chat-loading.py
          python3 scripts/tests/check-chat-chart-fences.py
          python3 scripts/check-chat-opening.py
          python3 scripts/check-chat-empty-recovery.py
          python3 scripts/check-chat-send-context.py
          python3 scripts/check-chat-preview-loading.py
          python3 scripts/check-chat-drop-routing.py
          python3 scripts/check-chat-activity-owner.py
          python3 scripts/check-chat-steer-submission.py
          python3 scripts/check-chat-steer-delivery.py
          python3 scripts/check-chat-read-scope.py
          python3 scripts/check-watching-scope.py
          python3 scripts/check-vault-scope.py
          python3 scripts/check-ssh-workbench.py
          python3 scripts/tests/chat-model-review.py
          python3 scripts/tests/chat-recovery-cache.py
          python3 scripts/tests/screen-viewer-lifecycle.py
          python3 scripts/tests/terminal-final-output.py
          python3 scripts/tests/terminal-program-status.py --platform apple
          python3 scripts/tests/live-work-compatibility.py

      - name: Validate Apple widget signing rules
        run: |
          python3 scripts/test_sign_mac_app.py
          python3 scripts/tests/AppleWidgetSigningTests.py

  windows-state-tests:
    needs: checks
    if: needs.checks.outputs.full == 'true' || needs.checks.outputs.windows == 'true'
    name: windows state tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Run portable client state regressions
        run: bash scripts/run-windows-state-tests.sh
      - name: Terminal program status presentation
        run: python3 scripts/tests/terminal-program-status.py --platform windows
      - name: Check independent Windows chat loading
        run: |
          python3 scripts/check-windows-chat-loading.py
          python3 scripts/check-windows-review-loading.py
          python3 scripts/check-windows-tab-mount.py
      - name: Check lazy Windows chat inspector and projection
        run: |
          python3 scripts/check-windows-chat-inspector.py
          python3 scripts/check-windows-chat-projection.py

  test:
    needs: checks
    if: needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true' || needs.checks.outputs.windows == 'true' || needs.checks.outputs.charts == 'true'
    name: test ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.checks.outputs.test-os) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        id: rust_build
        run: cargo build -p tokenstat-cli -p tokenstat-host --bins --all-features --locked

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Chart Python SDK across legacy text locales
        env:
          LC_ALL: C
          PYTHONUTF8: '0'
          PYTHONCOERCECLOCALE: '0'
        run: python -X utf8=0 scripts/tests/chart-sdk.py

      - name: Stage the shipping Windows terminal transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/stage-windows-conpty.ps1 -Out target/debug/deps
          ./scripts/stage-windows-conpty.ps1 -Out target/debug

      - name: Test
        if: needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true'
        env:
          TOKENSTAT_SCREEN_FIXTURE: ${{ runner.temp }}/tokenstat-screen-fixture
          TOKENSTAT_TEST_CONPTY_PROGRAM_STATUS: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo test --workspace --all-features --locked

      # Windows UI playback consumes frames produced by this Rust test. A UI-only
      # change skips the workspace suite, but must still generate that fixture.
      - name: Generate native H.264 frames for Windows UI changes
        if: runner.os == 'Windows' && needs.checks.outputs.full != 'true' && needs.checks.outputs.rust != 'true'
        env:
          TOKENSTAT_SCREEN_FIXTURE: ${{ runner.temp }}/tokenstat-screen-fixture
        run: cargo test --locked -p tokenstat-host --lib windows_screen::tests::native_encoder_produces_an_independent_annex_b_frame -- --exact

      - name: Test without the local half
        if: runner.os == 'Linux' && (needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true')
        run: cargo test -p tokenstat-host -p tokenstat-ffi --no-default-features --locked

      - name: Live chat routing regressions
        if: runner.os == 'macOS'
        run: python3 scripts/tests/chat-routing-e2e.py

      - name: 1.5.0 client wire compatibility
        if: runner.os == 'Linux' && (needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true')
        run: python3 scripts/tests/client-150-compat.py

      - uses: actions/setup-dotnet@v6
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.rust_build.outcome == 'success' }}
        with:
          dotnet-version: '8.0.x'

      - name: Compile the native Windows UI
        id: windows_ui_compile
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.rust_build.outcome == 'success' }}
        run: dotnet build apps/windows/Tokenstat.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64

      - name: Native Windows editor and H.264 playback regressions
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_ui_compile.outcome == 'success' }}
        shell: pwsh
        env:
          TOKENSTAT_SCREEN_FIXTURE: ${{ runner.temp }}/tokenstat-screen-fixture
        timeout-minutes: 5
        run: |
          dotnet run --project scripts/tests/windows-ui/WindowsUiTests.csproj -c Release -- --skip-teams-ui --skip-chart-ui
          $result = $LASTEXITCODE
          Get-Content "$env:TOKENSTAT_SCREEN_FIXTURE/ui-tests.log" -ErrorAction Continue
          if ($result -ne 0) {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction Continue |
              Where-Object { $_.Message -match 'WindowsUiTests|Microsoft.UI.Xaml' } |
              Select-Object TimeCreated, ProviderName, Message | Format-List
          }
          exit $result

      - name: Production Windows application startup
        id: windows_startup
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_ui_compile.outcome == 'success' }}
        timeout-minutes: 3
        run: ./scripts/tests/windows-ui/startup.ps1

      - name: Diagnose a failed production Windows startup
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_startup.outcome == 'failure' }}
        timeout-minutes: 3
        run: ./scripts/tests/windows-ui/startup.ps1 -TraceNative

      - name: Windows client and daemon lifetime regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project scripts/tests/windows-install/WindowsInstallTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/tests/windows-host/WindowsHostTests.csproj -- --hostd "$PWD/target/debug/tokenstat-hostd.exe"

  mac-client:
    needs: checks
    if: needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true' || needs.checks.outputs.apple == 'true' || needs.checks.outputs.charts == 'true'
    name: mac client
    env:
      RUSTFLAGS: ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac-app
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the macOS FFI
        run: scripts/build-ffi-xcframework.sh macos

      - name: Ensure the Metal toolchain
        run: scripts/ensure-metal-toolchain.sh

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/mac && xcodegen

      - name: Build the universal Mac app
        run: |
          xcodebuild -project apps/mac/Tokenstat.xcodeproj \
            -scheme Tokenstat \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build

  # Compile the shared Rust layer and the iOS app on both simulator architectures.
  apple-client:
    needs: checks
    if: needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true' || needs.checks.outputs.apple == 'true' || needs.checks.outputs.charts == 'true'
    name: ios client
    env:
      RUSTFLAGS: ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Both simulator architectures. `generic/platform=iOS Simulator` builds
      # every architecture the SDK has, so a library holding arm64 alone fails
      # the link on x86_64 even on an Apple Silicon runner. Installing the
      # second target is cheaper than teaching the build to skip it, and it is
      # the slice anyone on an Intel Mac needs anyway.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-client
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Simulator slices only. The app links whatever the xcframework holds, and
      # building the macOS slices as well would double this job to prove
      # something the test matrix already proves.
      - name: Build the FFI for the simulator
        run: scripts/build-ffi-xcframework.sh sim

      - name: Ensure the Metal toolchain
        run: scripts/ensure-metal-toolchain.sh

      # Compile the phone root and shared views without requiring signing.
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/mac && xcodegen

      - name: Build the app for the simulator
        run: |
          xcodebuild -project apps/mac/Tokenstat.xcodeproj \
            -scheme Tokenstat \
            -destination 'generic/platform=iOS Simulator' \
            build

  android-client:
    needs: checks
    if: needs.checks.outputs.full == 'true' || needs.checks.outputs.rust == 'true' || needs.checks.outputs.android == 'true' || needs.checks.outputs.charts == 'true'
    name: android client
    env:
      RUSTFLAGS: ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check native benchmark result handling
        run: python3 scripts/tests/benchmark-android-chat-images.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-client
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the Rust Android driver
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"

      # JNI-only builds do not automatically install AGP's stripping toolchain.
      - name: Install the pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Unit tests, debug lint and APK
        run: gradle -p apps/android testDebugUnitTest lintDebug assembleDebug

      - name: Release lint and bundle
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: gradle -p apps/android lintRelease bundleRelease

      - name: Verify native symbols are embedded
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: |
          python3 scripts/android-bundle-symbols.py \
            apps/android/app/build/outputs/bundle/release/app-release.aab \
            apps/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Keep native debug symbols with the bundle
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        uses: actions/upload-artifact@v7
        with:
          name: tokenstat-android
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/native-debug-symbols/release/**
            apps/android/app/build/outputs/mapping/release/**

  audit:
    needs: checks
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) || needs.checks.outputs.dependencies == 'true'
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit
