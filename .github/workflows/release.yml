name: release

# Cut a release by pushing an annotated tag that points at a commit on main:
#
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# Tag-only trigger. Do not add branch pushes or workflow_dispatch here: that
# pattern created empty "No jobs were run" failure runs on every push to main.
# To re-run a failed release, move the tag and push again.
#
# Signing secrets belong on the `release` environment (not repository secrets),
# with deployment limited to tags matching `v*`. The `approve` job asks for
# that environment's permission right after the tag checks (before the build
# matrix), so you are not waiting on six targets to finish first. `publish`
# also uses the environment for signing secrets; if required reviewers are set,
# GitHub may prompt a second time there. To get a single prompt: put reviewers
# on a gate-only environment and keep secrets on `release` without reviewers.
#
# A tag containing a hyphen (v0.1.0-rc.1) publishes as a prerelease.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history so a tag that is not tip-of-main still proves ancestry.
          fetch-depth: 0

      - name: Resolve version from tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not a semantic version (expected vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the manifest version matches the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$manifest" != "$VERSION" ]; then
            echo "Cargo.toml version '$manifest' does not match tag version '$VERSION'." >&2
            exit 1
          fi

      - name: Require the tag to point at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point at a commit reachable from origin/main." >&2
            git rev-parse HEAD
            git rev-parse origin/main
            exit 1
          fi

  # Ask for the release-environment approval immediately after the tag checks,
  # not after every target has finished building. Builds wait on this so a
  # rejected release does not burn matrix minutes. publish also uses the
  # environment (for signing secrets); if your environment has required
  # reviewers, GitHub may ask once more there — approve both, or put
  # reviewers only on this gate and leave secrets on an environment without
  # reviewers (tag-restricted).
  approve:
    name: await release approval
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Release approved
        run: echo "release ${{ github.ref_name }} approved; starting builds"

  build:
    name: build ${{ matrix.target }}
    needs: [verify, approve]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tokenstat-cli

      # Signing happens only in the publish job (environment: release), so these
      # matrix builds never see Developer ID / notary secrets. A PR workflow
      # cannot reach those secrets even if someone copies the secret names.
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="tokenstat-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${TARGET}/release/tokenstat.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/tokenstat" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/" 2>/dev/null || cp README.md "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
            asset="${name}.zip"
          else
            tar czf "${name}.tar.gz" "${name}"
            asset="${name}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          retention-days: 7

  publish:
    name: publish github release
    needs: [verify, approve, build]
    # macOS: sign + notarize Darwin archives here, where environment secrets live.
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Sign and notarize macOS archives
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DEVELOPER_ID_P12_BASE64}" ]; then
            echo "Skipping signing (DEVELOPER_ID_P12_BASE64 not set on the release environment)."
            exit 0
          fi

          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN="${RUNNER_TEMP}/tokenstat.keychain-db"
          # GitHub secret UIs often leave a trailing newline; that alone makes
          # SecKeychainItemImport report "MAC verification failed (wrong password?)".
          KEYCHAIN_PW="$(printf '%s' "${KEYCHAIN_PASSWORD:-}" | tr -d '\r\n')"
          P12_PASS="$(printf '%s' "${DEVELOPER_ID_P12_PASSWORD:-}" | tr -d '\r\n')"
          if [ -z "${KEYCHAIN_PW}" ]; then
            KEYCHAIN_PW="$(openssl rand -base64 32)"
          fi
          if [ -z "${P12_PASS}" ]; then
            echo "DEVELOPER_ID_P12_PASSWORD is empty on the release environment." >&2
            exit 1
          fi

          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | tr -d '\r\n\t ' | base64 --decode > "${CERT_PATH}"
          if [ ! -s "${CERT_PATH}" ]; then
            echo "DEVELOPER_ID_P12_BASE64 did not decode to a non-empty file." >&2
            exit 1
          fi

          # Fail with a clear message before security(1) if the password is wrong.
          # OpenSSL 3 sometimes needs -legacy for older P12 MACs.
          if ! openssl pkcs12 -in "${CERT_PATH}" -passin "pass:${P12_PASS}" -noout 2>/dev/null \
            && ! openssl pkcs12 -in "${CERT_PATH}" -passin "pass:${P12_PASS}" -noout -legacy 2>/dev/null; then
            echo "PKCS12 rejected the password (or the .p12 is corrupt)." >&2
            echo "Re-export the Developer ID .p12, base64-encode it, and update" >&2
            echo "DEVELOPER_ID_P12_BASE64 + DEVELOPER_ID_P12_PASSWORD on the release environment." >&2
            echo "Trim any trailing newline when pasting the password." >&2
            exit 1
          fi

          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          if ! security import "${CERT_PATH}" -k "${KEYCHAIN}" -P "${P12_PASS}" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            echo "security import failed after openssl accepted the password." >&2
            exit 1
          fi
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}"
          rm -f "${CERT_PATH}"

          IDENTITY="${DEVELOPER_ID_APP:-}"
          if [ -z "${IDENTITY}" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN}" \
              | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          fi
          if [ -z "${IDENTITY}" ]; then
            echo "No Developer ID Application identity (set DEVELOPER_ID_APP or fix the p12)." >&2
            exit 1
          fi
          : "${TEAM_ID:=}"

          NOTARY_KEY_PATH=""
          if [ -n "${NOTARY_KEY_P8_BASE64}" ] && [ -n "${NOTARY_KEY_ID}" ] && [ -n "${NOTARY_ISSUER_ID}" ]; then
            NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
            printf '%s' "${NOTARY_KEY_P8_BASE64}" | tr -d '\r\n\t ' | base64 --decode > "${NOTARY_KEY_PATH}"
          else
            echo "Skipping notarization (NOTARY_* secrets not set)."
          fi

          sign_one() {
            local target="$1"
            local archive="dist/tokenstat-${VERSION}-${target}.tar.gz"
            local work="${RUNNER_TEMP}/sign-${target}"
            rm -rf "${work}"
            mkdir -p "${work}"
            tar xzf "${archive}" -C "${work}"
            local bin
            bin="$(find "${work}" -type f -name tokenstat | head -n1)"
            if [ -z "${bin}" ]; then
              echo "no tokenstat binary in ${archive}" >&2
              exit 1
            fi
            codesign --force --options runtime --timestamp \
              --sign "${IDENTITY}" "${bin}"
            codesign --verify --verbose=2 "${bin}"
            if [ -n "${NOTARY_KEY_PATH}" ]; then
              local zip="${RUNNER_TEMP}/tokenstat-notarize-${target}.zip"
              ditto -c -k --keepParent "${bin}" "${zip}"
              xcrun notarytool submit "${zip}" \
                --key "${NOTARY_KEY_PATH}" \
                --key-id "${NOTARY_KEY_ID}" \
                --issuer "${NOTARY_ISSUER_ID}" \
                --wait
              xcrun stapler staple "${bin}" || true
              rm -f "${zip}"
            fi
            local dir
            dir="$(dirname "${bin}")"
            local base
            base="$(basename "${dir}")"
            tar czf "${archive}" -C "$(dirname "${dir}")" "${base}"
          }

          sign_one aarch64-apple-darwin
          sign_one x86_64-apple-darwin
          if [ -n "${NOTARY_KEY_PATH}" ]; then
            rm -f "${NOTARY_KEY_PATH}"
          fi

      - name: Collect checksums
        run: |
          cd dist
          rm -f ./*.sha256 SHA256SUMS
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          chmod +x .github/scripts/release-notes.sh
          .github/scripts/release-notes.sh "$VERSION" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: tokenstat v${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  # Homebrew tap and Scoop manifest updates hook in here once the artifact
  # layout is stable. Both consume dist/SHA256SUMS from the published release,
  # so no change to the build job is required.
  #
  # tap:
  #   name: update homebrew tap
  #   needs: [verify, publish]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Bump formula in gyorgysh/homebrew-tap
  #       ...
