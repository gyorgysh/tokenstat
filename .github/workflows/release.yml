name: release

# Cut a release by pushing an annotated tag that points at a commit on main:
#
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# Tag-only trigger. Do not add branch pushes or workflow_dispatch here: that
# pattern created empty "No jobs were run" failure runs on every push to main.
# To re-run a failed release, move the tag and push again.
#
# Signing secrets and required reviewers live on the `release` environment,
# with deployment limited to tags matching `v*`. The build matrix cannot access
# those secrets. GitHub asks once, before the publish job signs and releases.
#
# A tag containing a hyphen (v0.1.0-rc.1) publishes as a prerelease.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history so a tag that is not tip-of-main still proves ancestry.
          fetch-depth: 0

      - name: Resolve version from tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not a semantic version (expected vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the manifest version matches the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$manifest" != "$VERSION" ]; then
            echo "Cargo.toml version '$manifest' does not match tag version '$VERSION'." >&2
            exit 1
          fi

      - name: Require the tag to point at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point at a commit reachable from origin/main." >&2
            git rev-parse HEAD
            git rev-parse origin/main
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restore only. A release runs on a tag, and a cache saved under
      # `refs/tags/v0.6.5` can never be read by the run for `v0.6.6`: cache
      # scope is the ref that wrote it, plus the default branch. So saving here
      # writes about 2.5 GB per release that nothing will ever restore, and the
      # repository shares a 10 GB budget with CI. Three releases had taken 7.4
      # GB of it and were evicting the caches on `main` that do get reused.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: false

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tokenstat-cli

      # Signing happens only in publish (release environment secrets).
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="tokenstat-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${TARGET}/release/tokenstat.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/tokenstat" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/" 2>/dev/null || cp README.md "dist/${name}/"
          # The permissive dependencies ask that their notices travel with the
          # binary. Generated here rather than tracked, see xtask/src/notices.rs.
          cargo run --release --locked -p xtask -- notices \
            "dist/${name}/THIRD-PARTY-NOTICES.md" tokenstat-cli
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
            asset="${name}.zip"
          else
            tar czf "${name}.tar.gz" "${name}"
            asset="${name}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          retention-days: 7

  # The Mac app, unsigned. The Developer ID identity lives on the release
  # environment and the build matrix cannot reach it, so this produces the
  # bundle and `publish` signs, notarizes and wraps it in a disk image.
  app:
    name: build the mac app
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal, so one download runs on both kinds of Mac.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Restore only, for the reason above the build matrix's cache step.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-app
          save-if: false

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build Tokenstat.app
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: scripts/build-mac-app.sh "$VERSION" dist

      # ditto rather than upload-artifact over the bundle directly: the action
      # does not preserve the symlinks inside a .app, and a bundle that lost
      # them cannot be signed.
      - name: Archive the bundle
        run: ditto -c -k --keepParent dist/Tokenstat.app dist/Tokenstat-app-unsigned.zip

      - uses: actions/upload-artifact@v7
        with:
          name: release-mac-app
          path: dist/Tokenstat-app-unsigned.zip
          retention-days: 7

  # Windows desktop app, unsigned. Authenticode is not in this workflow.
  # Preview is unsigned on purpose. A later signed cut pins the publisher
  # from the running binary, the way the Mac installer reads Developer ID.
  windows-app:
    name: build the windows app
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-app
          save-if: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build unsigned Tokenstat.exe
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          scripts/build-windows-app.ps1 -Version $env:VERSION -Rid win-x64 -Out dist
          $name = "tokenstat-$($env:VERSION)-windows-x64"
          Push-Location dist
          7z a "$name.zip" $name | Out-Null
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value "$hash  $name.zip"
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-app
          path: |
            dist/tokenstat-${{ needs.verify.outputs.version }}-windows-x64.zip
            dist/tokenstat-${{ needs.verify.outputs.version }}-windows-x64.zip.sha256
          retention-days: 7

  android:
    name: publish android internal track
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
          save-if: false

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Install Android Rust driver
        run: cargo install cargo-ndk --locked

      - name: Decode Play signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tokenstat-play.jks"

      - name: Build signed Android App Bundle
        env:
          TOKENSTAT_ANDROID_KEYSTORE: ${{ runner.temp }}/tokenstat-play.jks
          TOKENSTAT_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          TOKENSTAT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TOKENSTAT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p apps/android bundleRelease

      - name: Upload to Play internal testing
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.tokenstat.tokenstat
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  publish:
    name: publish github release
    needs: [verify, build, app, windows-app]
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Sign and notarize macOS archives
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # Never enable xtrace here: passwords and PEM material must not hit logs.
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${DEVELOPER_ID_P12_BASE64}" ]; then
            echo "Skipping signing (DEVELOPER_ID_P12_BASE64 not set on the release environment)."
            exit 0
          fi

          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          CERT_IMPORT="${RUNNER_TEMP}/developer-id-import.p12"
          CERT_PEM="${RUNNER_TEMP}/developer-id-cert.pem"
          KEY_PEM="${RUNNER_TEMP}/developer-id-key.pem"
          PASS_FILE="${RUNNER_TEMP}/p12.pass"
          KEYCHAIN="${RUNNER_TEMP}/tokenstat.keychain-db"
          # GitHub secret UIs often leave a trailing newline; that alone makes
          # SecKeychainItemImport report "MAC verification failed (wrong password?)".
          KEYCHAIN_PW="$(printf '%s' "${KEYCHAIN_PASSWORD:-}" | tr -d '\r\n')"
          P12_PASS="$(printf '%s' "${DEVELOPER_ID_P12_PASSWORD:-}" | tr -d '\r\n')"
          if [ -z "${KEYCHAIN_PW}" ]; then
            KEYCHAIN_PW="$(openssl rand -base64 32)"
          fi
          if [ -z "${P12_PASS}" ]; then
            echo "DEVELOPER_ID_P12_PASSWORD is empty on the release environment." >&2
            exit 1
          fi
          printf '%s' "${P12_PASS}" > "${PASS_FILE}"

          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | tr -d '\r\n\t ' | base64 --decode > "${CERT_PATH}"
          if [ ! -s "${CERT_PATH}" ]; then
            echo "DEVELOPER_ID_P12_BASE64 did not decode to a non-empty file." >&2
            exit 1
          fi

          # Fail with a clear message if the password is wrong. OpenSSL 3 often
          # needs -legacy for older P12 MACs. Prefer pass:file so special
          # characters in the password are not reinterpreted by the shell.
          if ! openssl pkcs12 -in "${CERT_PATH}" -passin "file:${PASS_FILE}" -noout 2>/dev/null \
            && ! openssl pkcs12 -in "${CERT_PATH}" -passin "file:${PASS_FILE}" -noout -legacy 2>/dev/null; then
            echo "PKCS12 rejected the password (or the .p12 is corrupt)." >&2
            echo "Re-export the Developer ID .p12, base64-encode it, and update" >&2
            echo "DEVELOPER_ID_P12_BASE64 + DEVELOPER_ID_P12_PASSWORD on the release environment." >&2
            echo "Trim any trailing newline when pasting the password." >&2
            exit 1
          fi

          # Apple's security(1) often rejects modern OpenSSL 3 P12 MACs even when
          # openssl accepts the same password ("MAC verification failed").
          # Extract the identity certificate and private key separately, then
          # re-export with PBES1/SHA1 algorithms Security.framework accepts.
          extract_component() {
            local output="$1"
            shift
            if openssl pkcs12 -in "${CERT_PATH}" -passin "file:${PASS_FILE}" \
              "$@" -out "${output}" 2>/dev/null; then
              return 0
            fi
            openssl pkcs12 -in "${CERT_PATH}" -passin "file:${PASS_FILE}" \
              "$@" -out "${output}" -legacy 2>/dev/null
          }
          if ! extract_component "${CERT_PEM}" -clcerts -nokeys \
            || ! extract_component "${KEY_PEM}" -nocerts -nodes; then
            echo "Failed to extract the Developer ID certificate and private key." >&2
            exit 1
          fi
          if ! openssl pkcs12 -export -in "${CERT_PEM}" -inkey "${KEY_PEM}" \
            -out "${CERT_IMPORT}" \
            -passout "file:${PASS_FILE}" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg SHA1; then
            echo "Failed to re-export PKCS12 into an Apple-compatible form." >&2
            exit 1
          fi

          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          if ! security import "${CERT_IMPORT}" -k "${KEYCHAIN}" -P "${P12_PASS}" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            echo "security import failed after converting the PKCS12 for Apple." >&2
            echo "Re-export the Developer ID certificate from Keychain Access as a" >&2
            echo ".p12, update DEVELOPER_ID_P12_BASE64 and DEVELOPER_ID_P12_PASSWORD." >&2
            exit 1
          fi
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}"
          rm -f "${CERT_PATH}" "${CERT_IMPORT}" "${CERT_PEM}" "${KEY_PEM}" "${PASS_FILE}"

          IDENTITY="${DEVELOPER_ID_APP:-}"
          if [ -z "${IDENTITY}" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN}" \
              | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          fi
          if [ -z "${IDENTITY}" ]; then
            echo "No Developer ID Application identity (set DEVELOPER_ID_APP or fix the p12)." >&2
            exit 1
          fi
          : "${TEAM_ID:=}"

          NOTARY_KEY_PATH=""
          if [ -n "${NOTARY_KEY_P8_BASE64}" ] && [ -n "${NOTARY_KEY_ID}" ] && [ -n "${NOTARY_ISSUER_ID}" ]; then
            NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
            printf '%s' "${NOTARY_KEY_P8_BASE64}" | tr -d '\r\n\t ' | base64 --decode > "${NOTARY_KEY_PATH}"
          else
            echo "Skipping notarization (NOTARY_* secrets not set)."
          fi

          sign_one() {
            local target="$1"
            local archive="dist/tokenstat-${VERSION}-${target}.tar.gz"
            local work="${RUNNER_TEMP}/sign-${target}"
            rm -rf "${work}"
            mkdir -p "${work}"
            tar xzf "${archive}" -C "${work}"
            local bin
            bin="$(find "${work}" -type f -name tokenstat | head -n1)"
            if [ -z "${bin}" ]; then
              echo "no tokenstat binary in ${archive}" >&2
              exit 1
            fi
            codesign --force --options runtime --timestamp \
              --sign "${IDENTITY}" "${bin}"
            codesign --verify --verbose=2 "${bin}"
            if [ -n "${NOTARY_KEY_PATH}" ]; then
              local zip="${RUNNER_TEMP}/tokenstat-notarize-${target}.zip"
              ditto -c -k --keepParent "${bin}" "${zip}"
              xcrun notarytool submit "${zip}" \
                --key "${NOTARY_KEY_PATH}" \
                --key-id "${NOTARY_KEY_ID}" \
                --issuer "${NOTARY_ISSUER_ID}" \
                --wait
              xcrun stapler staple "${bin}" || true
              rm -f "${zip}"
            fi
            local dir
            dir="$(dirname "${bin}")"
            local base
            base="$(basename "${dir}")"
            tar czf "${archive}" -C "$(dirname "${dir}")" "${base}"
          }

          sign_one aarch64-apple-darwin
          sign_one x86_64-apple-darwin

          # The app, then the disk image that carries it.
          #
          # The app is signed deep and the image is signed after it is built,
          # because Gatekeeper checks the image the user actually downloaded.
          # Notarizing the image alone is enough: stapling to the .dmg means the
          # first launch works with no network, which is the point of stapling.
          sign_app() {
            local work="${RUNNER_TEMP}/sign-app"
            local app="${work}/Tokenstat.app"
            rm -rf "${work}"
            mkdir -p "${work}"
            ditto -x -k dist/Tokenstat-app-unsigned.zip "${work}"
            if [ ! -d "${app}" ]; then
              echo "no Tokenstat.app in dist/Tokenstat-app-unsigned.zip" >&2
              exit 1
            fi

            # The host helper first, by hand. It is a Mach-O executable living
            # in Resources, and codesign treats anything there as a resource to
            # hash rather than as code to sign, so --deep walks straight past
            # it. Notarization then rejects the whole image for one unsigned
            # binary, which is how v0.2.0 failed: "The binary is not signed with
            # a valid Developer ID certificate".
            local helper="${app}/Contents/Resources/tokenstat-hostd"
            if [ ! -f "${helper}" ]; then
              echo "no tokenstat-hostd in the bundle; the app cannot install a host" >&2
              exit 1
            fi
            codesign --force --options runtime --timestamp \
              --sign "${IDENTITY}" "${helper}"
            codesign --verify --strict --verbose=2 "${helper}"

            # --deep is deprecated for signing but the bundle embeds a Swift
            # package's frameworks, so the inner code has to be signed first and
            # the bundle last. Signing inside out by hand is the same thing with
            # more places to forget one. The helper is already signed above and
            # --deep leaves a resource's bytes alone, so the seal covers it.
            codesign --force --deep --options runtime --timestamp \
              --sign "${IDENTITY}" "${app}"
            codesign --verify --deep --strict --verbose=2 "${app}"

            local dmg="dist/tokenstat-${VERSION}-macos.dmg"
            scripts/package-mac-dmg.sh "${app}" "${dmg}" "tokenstat ${VERSION}"
            codesign --force --timestamp --sign "${IDENTITY}" "${dmg}"

            if [ -n "${NOTARY_KEY_PATH}" ]; then
              xcrun notarytool submit "${dmg}" \
                --key "${NOTARY_KEY_PATH}" \
                --key-id "${NOTARY_KEY_ID}" \
                --issuer "${NOTARY_ISSUER_ID}" \
                --wait
              xcrun stapler staple "${dmg}"
              # Proves the download opens on a machine that has never seen it.
              # A ticket that did not staple is a release that greets everybody
              # with "cannot be opened", so this one is not tolerated.
              spctl --assess --type open --context context:primary-signature \
                --verbose=2 "${dmg}"
            fi
            rm -f dist/Tokenstat-app-unsigned.zip
          }

          if [ -f dist/Tokenstat-app-unsigned.zip ]; then
            sign_app
          else
            echo "No app bundle to sign; skipping the disk image."
          fi

          if [ -n "${NOTARY_KEY_PATH}" ]; then
            rm -f "${NOTARY_KEY_PATH}"
          fi

      - name: Collect checksums
        run: |
          cd dist
          # An unsigned bundle survives only when the signing step was skipped
          # for want of secrets. Publishing it would hand somebody a download
          # Gatekeeper refuses, which is worse than shipping no app at all.
          rm -f Tokenstat-app-unsigned.zip
          rm -f ./*.sha256 SHA256SUMS
          for f in *.tar.gz *.zip *.dmg; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          chmod +x .github/scripts/release-notes.sh
          .github/scripts/release-notes.sh "$VERSION" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          name: tokenstat v${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
