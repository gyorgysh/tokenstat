[workspace]
resolver = "3"
members = ["crates/tokenstat-core", "crates/tokenstat-cli", "crates/tokenstat-sync", "crates/tokenstat-mcp", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["tokenstat contributors"]
repository = "https://github.com/gyorgysh/tokenstat"
homepage = "https://tokenstat.ai"

[workspace.dependencies]
tokenstat-core = { path = "crates/tokenstat-core", version = "0.1.0" }
tokenstat-sync = { path = "crates/tokenstat-sync", version = "0.1.0" }
tokenstat-mcp = { path = "crates/tokenstat-mcp", version = "0.1.0" }

# Core. Deliberately no network stack here: the privacy guarantee is that the
# crate reading your logs cannot send them anywhere.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = "0.2"
blake3 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
rayon = "1"
directories = "6"
zstd = "0.13"

# Sync (the only crate allowed to link a network stack)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
anyhow = "1"
flate2 = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"

# CLI
clap = { version = "4", features = ["derive", "wrap_help"] }
anstream = "0.6"
anstyle = "1"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
