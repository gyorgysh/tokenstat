[workspace]
resolver = "3"
members = ["crates/tokenstat-core", "crates/tokenstat-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["tokenstat contributors"]
repository = "https://github.com/gyorgysh/tokenstat"
homepage = "https://tokenstat.ai"

[workspace.dependencies]
tokenstat-core = { path = "crates/tokenstat-core", version = "0.0.1" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
