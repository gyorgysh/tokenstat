[workspace]
resolver = "3"
members = [
    "crates/tokenstat-core",
    "crates/tokenstat-cli",
    "crates/tokenstat-sync",
    "crates/tokenstat-mcp",
    "crates/tokenstat-workspace",
    "crates/tokenstat-pty",
    "crates/tokenstat-highlight",
    "crates/tokenstat-identity",
    "crates/tokenstat-remote",
    "crates/tokenstat-paths",
    "crates/tokenstat-host",
    "crates/tokenstat-ffi",
    "xtask",
]

[workspace.package]
version = "0.6.8"
edition = "2024"
rust-version = "1.85"
authors = ["tokenstat contributors"]
repository = "https://github.com/gyorgysh/tokenstat"
homepage = "https://tokenstat.ai"
# Source-available, not open source: read it, study it, build it for yourself,
# but publishing a copy or a build is reserved. SPDX has no identifier for
# terms like these, so the licence text itself is the reference. The name is
# not part of the grant either. See LICENSE and TRADEMARK.md.
license-file = "LICENSE"
# These crates are not published to crates.io. A registry upload is a
# redistribution under a licence that does not permit one, so the manifest
# refuses it rather than leaving it to a habit.
publish = false

[workspace.dependencies]
tokenstat-core = { path = "crates/tokenstat-core", version = "0.6.1" }
tokenstat-sync = { path = "crates/tokenstat-sync", version = "0.6.1" }
tokenstat-mcp = { path = "crates/tokenstat-mcp", version = "0.6.1" }
# `default-features = false` here so a member can opt in to the local half
# rather than opt out of it: a workspace dependency's default cannot be
# overridden downstream, and the mobile slices need it off. Every member that
# wants terminals and folders asks for `local-host` explicitly.
tokenstat-host = { path = "crates/tokenstat-host", version = "0.6.1", default-features = false }
tokenstat-workspace = { path = "crates/tokenstat-workspace", version = "0.6.1" }
tokenstat-pty = { path = "crates/tokenstat-pty", version = "0.6.1" }
tokenstat-highlight = { path = "crates/tokenstat-highlight", version = "0.6.1" }
tokenstat-identity = { path = "crates/tokenstat-identity", version = "0.6.1" }
tokenstat-remote = { path = "crates/tokenstat-remote", version = "0.6.1" }
tokenstat-paths = { path = "crates/tokenstat-paths", version = "0.6.8" }

# Core. Deliberately no network stack here: the privacy guarantee is that the
# crate reading your logs cannot send them anywhere.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = "0.2"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
rayon = "1"
directories = "6"
zstd = "0.13"

# Sync (the only crate allowed to link a network stack)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
anyhow = "1"
flate2 = "1"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"

# Machine identity and the remote transport. The static key a peer pins is the
# same key the Noise handshake authenticates, so there is one key and one
# question: is this the machine I agreed to talk to.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom", "std"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
rand = "0.10"

# CLI
clap = { version = "4", features = ["derive", "wrap_help"] }
anstream = "1"
anstyle = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"] }
crossterm = "0.29"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Static library for the Apple app. Differs from `release` in two ways, both
# forced by handing the archive to a toolchain that is not this one:
#
# - No LTO. Thin LTO leaves LLVM metadata in the objects, and Rust's LLVM runs
#   ahead of the one inside Xcode, so Apple's tools reject the archive with
#   "Unknown attribute kind". Cross-crate LTO cannot reach past the C boundary
#   anyway, so this costs nothing that matters here.
# - No stripping. Xcode links against these symbols by name.
[profile.release-ffi]
inherits = "release"
lto = false
strip = "none"
